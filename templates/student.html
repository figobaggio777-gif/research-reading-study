<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15493f"><meta name="robots" content="noindex,nofollow"><title>科研文献判断 · 学生入口</title><style>
:root{color-scheme:light;--ink:#182f3b;--slate:#475f69;--teal:#075f55;--deep:#124439;--border:#d6dfde;--soft:#eff5f3;--mint:#e6f2ec;--bg:#f5f7f5;font:16px/1.65 "Inter","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg)}h1,h2,h3,p,ul,ol,fieldset,blockquote,figure{margin:0}button,input{font:inherit}button,input,label{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:wait;opacity:.68}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #19877a;outline-offset:3px}button{transition:background .15s ease}a{color:var(--teal);text-underline-offset:.14em}.skip{position:absolute;left:-10000px;top:0}.skip:focus{left:1rem;background:#fff;padding:.4rem 1rem;z-index:20}.head{background:white;border-bottom:1px solid var(--border)}.headinner{max-width:1080px;margin:auto;min-height:70px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:1rem}.brand{display:flex;align-items:center;gap:.65rem;color:var(--ink);font-weight:750;letter-spacing:.02em}.mark{display:inline-flex;align-items:end;justify-content:center;gap:3px;width:34px;height:34px;padding:8px;background:#15493f;border-radius:8px;flex:none}.mark i{width:4px;height:13px;background:#eff7f1;border-radius:1px}.mark i:nth-child(2){height:18px}.mark i:last-child{height:15px;transform:rotate(-10deg);background:#97d3b2}.headsmall,.minor{font-size:.91rem;color:var(--slate)}.topbutton,.quiet{border:0;background:transparent;color:var(--teal);font-weight:630}.topbutton{min-height:44px;padding:.25rem .2rem}.wrap{max-width:1000px;margin:clamp(1.5rem,5.3vw,4.4rem) auto;padding:0 26px}.kicker{font-size:.90rem;font-weight:700;letter-spacing:.05em}.entry-view .head{display:none}.entry-view .wrap{margin:clamp(2rem,12vh,7rem) auto}.login{max-width:440px;margin:auto;padding:clamp(1.4rem,4.3vw,3.1rem);align-self:center}.identity-field{display:block;border:1.5px solid #9bb0a6;border-radius:8px;width:100%;height:48px;padding:0 .75rem;font-size:1rem;margin:.35rem 0 .8rem}.identity-field:last-of-type{margin-bottom:.45rem}.caption,.progress-label{font-size:.90rem;color:var(--slate)}.login .primary{margin-top:1.25rem;width:100%}.primary{border:1px solid var(--teal);background:var(--teal);color:white;font-size:1rem;font-weight:650;border-radius:8px;min-height:46px;padding:.64rem 1.25rem}.primary:hover{background:#094f47}.label{font-weight:650}.student{max-width:748px;margin:0 auto}.kicker{color:var(--teal)}.student h1{font-size:clamp(1.6rem,4vw,2.2rem);line-height:1.32;margin:.35rem 0 .9rem}.trail{display:flex;align-items:center;justify-content:space-between;gap:.75rem}.progress-label{white-space:nowrap;font-variant-numeric:tabular-nums}progress{display:block;width:100%;height:5px;margin-bottom:1.25rem;border:none;border-radius:10px;background:#d9e3df;color:var(--teal);overflow:hidden}progress::-webkit-progress-bar{background:#d9e3df}progress::-webkit-progress-value{background:var(--teal)}progress::-moz-progress-bar{background:var(--teal)}.card{padding:clamp(1.1rem,3.1vw,2.15rem);border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:0 4px 20px #182f3b06;overflow-wrap:anywhere}.card h2{font-size:1.15rem;margin-bottom:.5rem}.card .section+.section,.card .fields,.card .blocklabel{font-size:.91rem;font-weight:680;color:var(--slate);margin-bottom:.35rem}.criteria{display:grid;gap:.4rem;margin:.3rem 0 0;padding-left:1.6rem}.criteria li{padding-left:.25rem}.criteria li::marker{font-weight:700;color:var(--teal)}.claim{border-left:4px solid #26856d;background:#edf6ef;padding:.8rem 1rem;border-radius:0 8px 8px 0}.claim p:last-child{font-weight:650}.source{padding:1rem;border:1px solid #cedde4;border-radius:8px;background:#f3f7fa}.source .cite{font-size:.88rem;border-top:1px solid #d5e0e5;margin-top:.65rem;padding-top:.6rem;color:#465f6a}.source .minor{margin-top:.4rem}.feedback{background:var(--soft);border-radius:8px;padding:.95rem 1rem}.fields{display:grid;gap:1.4rem}.choices{min-width:0;border:0;padding:0}.choices legend{font-weight:680;font-size:1.02rem;margin-bottom:.55rem;padding:0}.options{display:grid;gap:.5rem}.option{border:1px solid var(--border);border-radius:8px;min-height:46px;background:#fff;display:flex;align-items:flex-start;gap:.6rem;padding:.64rem .8rem;cursor:pointer}.option:hover{border-color:#81a99a}.option:has(input:checked){border-color:#277d65;background:#ecf5ee}.option input{flex:none;margin:.28em .02em 0 0;width:1.1rem;height:1.1rem;accent-color:var(--teal)}.confidence{grid-template-columns:repeat(3,minmax(0,1fr))}.confidence .option{align-items:center;justify-content:center}.confidence input{margin:0}.actions{display:flex;flex-wrap:wrap;gap:.85rem;align-items:center;justify-content:space-between;margin-top:1.5rem;padding-top:1.15rem;border-top:1px solid var(--border)}.actions .caption{flex:1}.error:not(:empty){padding:.65rem .8rem;margin-top:.75rem;background:#fff4ec;color:#863814;border:1px solid #efd5c3;border-radius:6px}.sand{padding:.5rem .85rem;background:#fff4d9;color:#634c12;border:1px solid #ead9a9;border-radius:7px;margin-bottom:1rem;font-size:.92rem}.complete{margin:auto;max-width:580px}.complete h1{margin:.25rem 0 .7rem;font-size:1.8rem}.complete .actions{justify-content:flex-start}.pause{margin:0 auto 1rem;max-width:748px;padding:1rem;background:#fff;border:1px solid #91b3a4;border-radius:9px}.pause div{display:flex;gap:.6rem;margin-top:.65rem}.quiet{padding:.6rem}.statusbox{max-width:620px;margin:auto}.footnote{margin-top:1.35rem}.protocol{margin-top:.85rem}.protocol summary{cursor:pointer;font-weight:650;color:var(--teal);padding:.3rem 0}.flatlist{padding-left:1.25rem}.frame:focus{outline:0}
@media(max-width:670px){.headinner{min-height:56px;padding:0 16px}.wrap{margin:1rem auto 2rem;padding:0 14px}.entry-view .head{display:none}.entry-view .wrap{margin:clamp(2rem,12vh,7rem) auto}.login{max-width:440px;margin:auto;padding:1.3rem}.headsmall{font-size:.85rem}.actions{align-items:flex-end}.actions .caption{font-size:.84rem}.facts dd+dt{margin-top:.45rem}.student h1{margin-bottom:.7rem}.card{padding:1.05rem}.confidence{gap:.35rem}.confidence .option{padding:.55rem .2rem}.headinner .brand{gap:.45rem}.progress-label{font-size:.84rem}}
</style></head><body class="entry-view"><a class="skip" href="#content">跳至内容</a><header class="head"><div class="headinner"><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>图书馆科研支持</div><div id="topaction"></div></div></header><main class="wrap" id="content"><p class="statusbox" role="status">正在读取作答进度…</p></main><noscript><p>请开启浏览器的 JavaScript 后进入问卷。</p></noscript><script>(function mainClient(apiOrigin) {
  'use strict';
  const $ = (sel, parent = document) => parent.querySelector(sel);
  const root = $('#content'), top = $('#topaction');
  let batch = new URL(location.href).searchParams.get('batch');
  let pilotBatch = batch && history.state?.pilotBatch===batch ? batch : null;
  let state = null, busy = false;
  let bearer = '';
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  function error(msg) { const e=$('#err'); if(e) e.textContent=msg; }
  function footButton(text, caption) { return '<div class="actions"><span class="caption">'+esc(caption)+'</span><button class="primary" type="submit">'+esc(text)+'</button></div>'; }
  function put(html, focus=true) {
    root.innerHTML=html;
    document.body.classList.toggle('entry-view', !state);
    top.innerHTML=state && state.phase!=='complete' ? '<button class="topbutton" type="button" data-act="pause">暂时离开</button>' : '';
    if(focus){const h=$('h1',root);if(h){h.tabIndex=-1;h.classList.add('frame');h.focus({preventScroll:true});} window.scrollTo(0,0);}
  }
  function login(message='') {
    state=null;
    bearer='';
    history.replaceState(pilotBatch && batch===pilotBatch ? {pilotBatch} : null,'');
    put(`<form class="login card" id="enter" aria-label="学生登录" autocomplete="off">
        <label for="studentName" class="label">姓名</label>
        <input id="studentName" name="name" class="identity-field" type="text" autocomplete="off" spellcheck="false" enterkeyhint="next" maxlength="80" ${pilotBatch?'placeholder="预试可用化名"':''} required>
        <label for="studentId" class="label">学号</label>
        <input id="studentId" name="studentId" class="identity-field" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" maxlength="64" ${pilotBatch?'placeholder="预试可用虚构学号"':''} required>
        <p id="err" class="error" role="alert"></p>
        <button class="primary" type="submit">${pilotBatch?'进入完整预试':'进入测试'}</button>
      </form>`);
    error(message);
  }
  async function showEntry(message='') {
    if(batch!==null){login(message);return;}
    state=null;
    bearer='';
    pilotBatch=null;
    history.replaceState(null,'');
    put('<p class="statusbox" role="status">正在连接答题服务…</p>');
    try {
      pilotBatch=(await api('entry')).pilotBatch;
      login(message);
    } catch {
      put('<section class="statusbox card"><p>暂时无法读取答题入口，请稍后重试。</p><button type="button" class="primary" data-act="retry-entry">重新连接</button></section>');
    }
  }
  const sand=() => state.sandbox?'<p class="sand">当前为演练批次，作答与正式研究分开统计。</p>':'';
  function content() {
    const s=state;
    let str='';
    if(s.scenario) str+='<div class="section"><p class="blocklabel">项目情境</p><p>'+esc(s.scenario)+'</p></div>';
    if(s.conditions?.length) str+='<div class="section"><p class="blocklabel">项目要求</p><ol class="criteria">'+s.conditions.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol></div>';
    if(s.claim) str+='<blockquote class="section claim"><p class="blocklabel">AI 给出的说法</p><p>'+esc(s.claim)+'</p></blockquote>';
    if(s.evidence) {const e=s.evidence;str+='<div class="section source"><p class="blocklabel">文献材料</p><p>'+esc(e.text)+'</p>'+(e.note?'<p class="minor">'+esc(e.note)+'</p>':'')+'<p class="cite">'+[e.citation,e.location].filter(Boolean).map(esc).join('　')+'</p></div>';}
    if(s.message) str+='<p class="section feedback">'+esc(s.message)+'</p>';
    if(s.fields?.length) str+='<div class="fields">'+s.fields.map(f=>'<fieldset class="choices"><legend>'+esc(f.label)+'</legend><div class="options '+(f.options.length===6 && f.options.every(v=>String(v).includes('%'))?'confidence':'')+'">'+f.options.map((v,i)=>'<label class="option"><input type="radio" required name="'+esc(f.name)+'" value="'+i+'"><span>'+esc(v)+'</span></label>').join('')+'</div></fieldset>').join('')+'</div>';
    return str;
  }
  function render(next) {
    state=next;
    const saved={studentSession:next.sessionTag};
    if(pilotBatch) saved.pilotBatch=pilotBatch;
    if(apiOrigin) saved.studyBearer=bearer;
    history.replaceState(saved,'');
    if(state.phase==='complete'){put('<section class="complete">'+sand()+'<div class="card"><span class="kicker">作答完成</span><h1>已收到你的答卷</h1><p>感谢参与！如需申请撤回，请在参与说明约定的期限内联系研究团队。</p>'+(state.consent?.contact?'<p class="minor footnote">研究联系　'+esc(state.consent.contact)+'</p>':'')+(state.consent?.withdrawal?'<p class="minor">撤回方式与期限　'+esc(state.consent.withdrawal)+'</p>':'')+'<div class="actions"><button type="button" class="primary" data-act="leave">退出登录</button></div><p class="error" role="alert" id="err"></p></div></section>');return;}
    if(state.phase!=='task')throw new Error('暂时无法显示当前页，请刷新后用本人的姓名和学号继续。');
    const n=state.page;
    put('<section class="student">'+sand()+'<div class="trail"><span class="kicker">'+esc(state.stageLabel||'科研文献判断')+'</span><span class="progress-label">第 '+esc(n-1)+' / 23 页</span></div><h1>'+esc(state.title)+'</h1><progress aria-label="当前页" max="23" value="'+esc(n-1)+'"></progress><form id="answers" class="card">'+content()+'<p id="err" class="error" role="alert"></p>'+footButton(n===24?'提交答卷':'保存并继续',n===24?'提交后结束本次作答。':'翻页后本页作答即锁定。')+'</form></section>');
  }
  async function api(route,body) {
    const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),apiOrigin?90000:20000);
    try {
      const options={method:body===undefined?'GET':'POST',credentials:apiOrigin?'omit':'same-origin',cache:'no-store',redirect:'error',signal:ctl.signal,headers:{Accept:'application/json'}};
      if(apiOrigin && bearer && route!=='login') options.headers.Authorization='Bearer '+bearer;
      if(body!==undefined){options.headers['Content-Type']='application/json';options.body=JSON.stringify(body);}
      const resp=await fetch(apiOrigin+'/api/student/'+route,options);
      let out={}; try{out=await resp.json();}catch{}
      if(!resp.ok||!out.ok){let err=new Error(out.error||'连接暂时中断，请稍后重试。');err.status=resp.status;throw err;}
      if(apiOrigin && route==='login'){
        const issued=resp.headers.get('X-Study-Session');
        if(!/^[a-f0-9]{64}$/.test(issued||''))throw new Error('未能建立答题会话，请稍后再试。');
        bearer=issued;
      }
      if(route==='logout')bearer='';
      return out.state;
    } finally {clearTimeout(timer);}
  }
  function withTag(body){return state?.sessionTag?{...body,sessionTag:state.sessionTag}:body;}
  function showError(err){error(err?.name==='AbortError'||err instanceof TypeError?'网络连接暂未完成。请保持本页，恢复连接后重试。':err.message||'请重试。');}
  async function handle(fn,form) {
    if(busy)return;
    busy=true;
    const button=form?.querySelector('button[type="submit"]');if(button)button.disabled=true;
    const original=button?.textContent;
    const waiting=apiOrigin&&form?.id==='enter'&&button?setTimeout(()=>{button.textContent='正在连接答题服务…';},5000):null;
    try{error('');await fn();}
    catch(err){
      if(err.status===401 && state){await showEntry('登录已结束，请使用上次的姓名和学号。');}
      else if(err.status===409 && state){try{const current=await api('state');if(current.sessionTag!==state.sessionTag){await showEntry('当前浏览器的登录已变更。请使用上次的姓名和学号重新进入。');}else if(current.page!==state.page||current.phase!==state.phase){render(current);error('已同步到服务器上保存的进度。');}else{showError(err);}}catch{showError(err);}}
      else{showError(err);}
    } finally{clearTimeout(waiting);busy=false;if(button?.isConnected){button.disabled=false;button.textContent=original;}}
  }
  async function leave(){await api('logout',withTag({}));await showEntry();}
  document.addEventListener('submit',event=>{
    const form=event.target;if(!root.contains(form))return;
    event.preventDefault();
    if(!form.reportValidity())return;
    handle(async()=>{
      const values=new FormData(form);
      if(form.id==='enter'){
        const identity={name:values.get('name').trim(),studentId:values.get('studentId').trim()};
        if(batch!==null || pilotBatch!==null)identity.batch=batch ?? pilotBatch;
        const next=await api('login',identity);
        if(pilotBatch && batch===null && next.sandbox) {
          batch=pilotBatch;
          const scoped=new URL(location.href);
          scoped.searchParams.set('batch',batch);
          history.replaceState({pilotBatch},'',scoped.href);
        }
        render(next);
        return;
      }
      if(form.id==='answers'){const answers={};for(const f of state.fields||[])answers[f.name]=Number(values.get(f.name));render(await api('next',withTag({page:state.page,answers})));return;}
    },form);
  });
  document.addEventListener('click',e=>{
    const act=e.target.closest('[data-act]')?.dataset.act;
    if(!act||busy)return;
    if(act==='retry-entry'){handle(()=>showEntry());return;}
    if(act==='leave') {handle(leave);return;}
    if(act==='cancel'){const panel=$('.pause');if(panel)panel.remove();$('#topaction button')?.focus();return;}
    if(act==='pause'){
      if($('.pause'))return;
      const panel=document.createElement('section');panel.className='pause';panel.innerHTML='<strong>现在离开？</strong><p>下次打开原链接，填写本人的姓名和学号，即可继续。已翻过的页面已保存，当前页未提交的选择需要重填。</p><div><button type="button" class="primary" data-act="leave">退出，稍后续答</button><button type="button" class="quiet" data-act="cancel">继续作答</button></div>';
      root.prepend(panel);panel.querySelector('button').focus();panel.scrollIntoView({block:'nearest'});
    }
  });
  async function boot(){
    const tag=history.state?.studentSession;
    if(!tag){await showEntry();return;}
    if(apiOrigin){
      const token=history.state?.studyBearer;
      if(!/^[a-f0-9]{64}$/.test(token||'')){await showEntry();return;}
      bearer=token;
    }
    try{
      const current=await api('state');
      if(current.sessionTag===tag){render(current);return;}
      await showEntry('当前浏览器的登录已变更。请使用上次的姓名和学号重新进入。');
    }catch(err){await showEntry(err.status===401?'登录已结束，请使用上次的姓名和学号。':'若已有进度，请使用上次的姓名和学号重新进入。');}
  }
  boot();
})("https://study-backend.invalid");</script></body></html>
